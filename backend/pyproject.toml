[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::DeprecationWarning:agents.*",
    "error::DeprecationWarning:memory.*",
    "error::DeprecationWarning:graph.*",
    "error::DeprecationWarning:schemas.*",
]
