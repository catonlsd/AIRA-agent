# AIRA-X — local + small-scale production stack.
#
# Prerequisite: create backend/.env (copy backend/.env.example and fill keys).
#   cp backend/.env.example backend/.env
#
# Then:  docker compose up --build
#   frontend -> http://localhost:3000
#   backend  -> http://localhost:8000  (/health, /ready)

services:
  backend:
    build:
      context: ./backend
    image: aira-x-backend
    env_file:
      - ${AIRA_BACKEND_ENV_FILE:-./backend/.env}
    environment:
      # Keep persistent data on the mounted volume.
      CHROMA_DIR: /app/storage/chroma
      VECTOR_DB_DIR: /app/storage/vector_index
      UPLOAD_DIR: /app/storage/uploads
      ARTIFACTS_DIR: /app/storage/artifacts
      DATABASE_URL: sqlite:///./storage/research_assistant.db
      AIRA_TRACE_LOG: /app/storage/traces.jsonl
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aira_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked at build time; must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: aira-x-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aira_storage:
