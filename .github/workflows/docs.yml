name: Docs & packaging

# Focused, fast gate that keeps the documentation honest: the packaging tests assert
# the required docs exist, cover the required sections, and that headline counts
# (adapters, profiles, operator routes) still match the live registry — so docs can't
# silently rot or be deleted. A distinct, quick status check separate from the full
# suite.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs & packaging tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify documentation & repository professionalization
        env:
          EMBEDDING_PROVIDER: hashing
          # Hermetic: the suite stubs the LLM, so this dummy key is never used for a
          # real call — it only satisfies the deliberate fail-fast in config.py that
          # requires a provider key for the default LLM_PROVIDER=groq.
          GROQ_API_KEY: ci-dummy-not-used
        run: >
          python -m pytest -q -p no:randomly
          tests/test_docs_packaging.py
          tests/test_repo_professionalization.py
