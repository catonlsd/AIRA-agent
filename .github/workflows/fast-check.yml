name: Fast check

# The day-to-day wall: backend tests + frontend type-check/tests/lint/build.
# Two independent jobs run in parallel. Deterministic (no random test ordering,
# hermetic embeddings, no provider keys). Runs on every push and PR.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the full backend suite (deterministic, regression wall included)
        env:
          # Hermetic: the suite stubs the LLM, so the dummy GROQ_API_KEY is never used
          # for a real call — it only satisfies config.py's deliberate fail-fast for the
          # default LLM_PROVIDER=groq. Keyword embeddings avoid model downloads. Single
          # pytest process — the test DB is shared SQLite, so we never run two suites
          # concurrently. `-p no:randomly` pins ordering.
          EMBEDDING_PROVIDER: hashing
          GROQ_API_KEY: ci-dummy-not-used
          AIRA_TRACE_LOG: ./storage/test-traces.jsonl
        run: python -m pytest -q -p no:randomly

  frontend:
    name: Frontend type-check, tests, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Unit tests (pure logic)
        run: node --test "lib/**/*.test.mts"

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
